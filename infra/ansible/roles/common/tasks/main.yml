---
- name: Оновити індекс пакетів і встановити оновлення безпеки
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    upgrade: safe

- name: Встановити базові пакети
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

# --- UFW: SSH дозволяємо ДО вмикання, щоб не відрізати себе ---
- name: UFW — дозволити потрібні TCP-порти
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ ufw_allowed_tcp_ports }}"

- name: UFW — політика за замовчуванням для вхідного трафіку (deny)
  community.general.ufw:
    default: deny
    direction: incoming

- name: UFW — політика за замовчуванням для вихідного трафіку (allow)
  community.general.ufw:
    default: allow
    direction: outgoing

- name: UFW — увімкнути
  community.general.ufw:
    state: enabled

# --- Fail2ban ---
- name: Fail2ban — конфігурація jail для sshd
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/sshd.local
    mode: "0644"
    content: |
      [sshd]
      enabled = true
      maxretry = 5
      findtime = 10m
      bantime = 1h
  notify: Restart fail2ban

- name: Fail2ban — запущено й увімкнено
  ansible.builtin.systemd:
    name: fail2ban
    state: started
    enabled: true

# --- SSH hardening: лише ключі, без root ---
- name: SSH — вимкнути вхід за паролем і для root
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/99-hardening.conf
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
    content: |
      PasswordAuthentication no
      PermitRootLogin no
  notify: Restart sshd
